# Test podpisywania po dodaniu czterech sekretów (bez publikowania wartości).
name: Android APK - Druki PPOZ
on:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - '*.gradle.kts'
      - 'gradle.properties'
      - '.github/workflows/android-apk.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Install Android 35
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - name: Offline source checks
        run: |
          python -m unittest discover -s tests -p 'test_*.py'
          test -s app/src/main/assets/index.html
          grep -q 'app-bottom-nav' app/src/main/assets/index.html
          grep -q 'addDocumentHistory' app/src/main/assets/index.html
      - name: Build installable diagnostic APK
        run: gradle --no-daemon :app:assembleDebug
      - name: Verify APK and contents
        run: |
          test -s app/build/outputs/apk/debug/app-debug.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose app/build/outputs/apk/debug/app-debug.apk
          unzip -l app/build/outputs/apk/debug/app-debug.apk | grep -F assets/index.html
          unzip -l app/build/outputs/apk/debug/app-debug.apk | grep -F assets/templates/noma2_blank.png
      - name: Publish APK for Android install
        uses: actions/upload-artifact@v4
        with:
          name: Druki-PPOZ-Android-APK-TEST
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
          if-no-files-found: error

      # The stable key must NEVER be published in the repository.
      - name: Detect stable release key
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        env:
          PPOZ_KEYSTORE_BASE64: ${{ secrets.PPOZ_KEYSTORE_BASE64 }}
          PPOZ_KEYSTORE_PASSWORD: ${{ secrets.PPOZ_KEYSTORE_PASSWORD }}
          PPOZ_KEY_ALIAS: ${{ secrets.PPOZ_KEY_ALIAS }}
          PPOZ_KEY_PASSWORD: ${{ secrets.PPOZ_KEY_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -n "$PPOZ_KEYSTORE_BASE64" && -n "$PPOZ_KEYSTORE_PASSWORD" && -n "$PPOZ_KEY_ALIAS" && -n "$PPOZ_KEY_PASSWORD" ]]; then
            echo "PPOZ_RELEASE_READY=true" >> "$GITHUB_ENV"
          else
            echo "PPOZ_RELEASE_READY=false" >> "$GITHUB_ENV"
            echo "No stable release key configured. Publishing debug diagnostic APK only."
          fi
      - name: Restore stable signing key
        if: env.PPOZ_RELEASE_READY == 'true'
        env:
          PPOZ_KEYSTORE_BASE64: ${{ secrets.PPOZ_KEYSTORE_BASE64 }}
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          printf '%s' "$PPOZ_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/druki-ppoz-release.p12"
          test -s "$RUNNER_TEMP/druki-ppoz-release.p12"
          echo "PPOZ_SIGNING_KEYSTORE=$RUNNER_TEMP/druki-ppoz-release.p12" >> "$GITHUB_ENV"
      - name: Compile and verify stable signed release
        if: env.PPOZ_RELEASE_READY == 'true'
        env:
          PPOZ_KEYSTORE_PASSWORD: ${{ secrets.PPOZ_KEYSTORE_PASSWORD }}
          PPOZ_KEY_ALIAS: ${{ secrets.PPOZ_KEY_ALIAS }}
          PPOZ_KEY_PASSWORD: ${{ secrets.PPOZ_KEY_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          gradle --no-daemon :app:assembleRelease
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs app/build/outputs/apk/release/app-release.apk
      - name: Publish updateable signed release APK
        if: env.PPOZ_RELEASE_READY == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: Druki-PPOZ-STALA-PODPISANA-APK
          path: app/build/outputs/apk/release/app-release.apk
          retention-days: 30
          if-no-files-found: error
      - name: Remove key file
        if: always()
        run: rm -f "$RUNNER_TEMP/druki-ppoz-release.p12"
